name: Automating image push to DockerHub
on: [push]
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}

      - name: Building and pushing Docker image to dockerhub
        run: |
          registry="hackim72000"
          sha=$(git rev-parse --short HEAD)
          primary_tag="${registry}/cicd-test:${sha}"

          docker build -t "$primary_tag" -f Dockerfile .
          docker push "$primary_tag"
